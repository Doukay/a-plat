<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prêtoutil - Mon profil</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<div id="haut"></div>
<main>
  <h1>Mon profil</h1>
  <form id="formulaire">
    <label for="prenom">Prénom</label>
    <input type="text" id="prenom" required>

    <label for="rue">Rue</label>
    <input type="text" id="rue" required>

    <label for="email">Adresse mail</label>
    <input type="email" id="email" disabled>

    <p id="enregistre" class="ok" role="status" hidden>Profil enregistré.</p>
    <button type="submit">Enregistrer</button>
  </form>
</main>
<div id="bas"></div>

<script>
habiller("profil");

const moi = exigerConnexion();
if (moi) {
  document.getElementById("prenom").value = moi.prenom;
  document.getElementById("rue").value = moi.rue;
  document.getElementById("email").value = moi.email;

  document.getElementById("formulaire").addEventListener("submit", (e) => {
    e.preventDefault();
    const profils = lire("profils", {});
    profils[moi.id] = {
      prenom: document.getElementById("prenom").value.trim(),
      rue: document.getElementById("rue").value.trim()
    };
    ecrire("profils", profils);
    habiller("profil");
    document.getElementById("enregistre").hidden = false;
  });
}
</script>
</body>
</html>
