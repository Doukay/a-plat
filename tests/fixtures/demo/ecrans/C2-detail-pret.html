<!doctype html>
<html lang="fr" data-ecran="C2">
<head><meta charset="utf-8"><title>C2 · Détail d'un prêt</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../commun.css"></head>
<body>
<header class="entete">
  <a class="retour" href="C1-mes-prets.html">‹ Retour</a>
  <h1>Perceuse sans fil</h1>
</header>

<main class="page">
  <div class="pile">
    <span class="pastille">En attente de réponse</span>
    <p class="doux">Demandée à Camille</p>
  </div>

  <ol class="etapes">
    <li class="fait"><span class="pile"><strong>Demande envoyée</strong><span class="doux petit">Camille l'a reçue</span></span></li>
    <li><span class="pile"><strong>Camille répond</strong><span class="doux petit">Vous êtes prévenu ici</span></span></li>
    <li><span class="pile"><strong>Récupération</strong><span class="doux petit">samedi 7 novembre</span></span></li>
    <li><span class="pile"><strong>Retour</strong><span class="doux petit">lundi 9 novembre</span></span></li>
  </ol>

  <div class="carte pile">
    <span class="doux petit">Votre message</span>
    <p>Bonjour, j'en ai besoin pour percer quelques trous dans un mur.</p>
  </div>

  <button class="bouton discret" type="button" data-nom="Bouton Annuler ma demande">Annuler ma demande</button>
</main>
<script src="../a-plat/relais.js"></script></body>
</html>
